services:
  - type: web
    name: jubilee-chalets-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed_demo_data && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: RENDER_EXTERNAL_HOSTNAME
        value: jubileecharlet-1.onrender.com
      - key: ALLOWED_HOSTS
        value: jubileecharlet-1.onrender.com
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

databases:
  - name: jubilee-db
    databaseName: jubilee_chalets
    user: jubilee
