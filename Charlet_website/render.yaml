services:
  - type: web
    name: jubilee-chalets-pms
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn jubilee_chalets.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: jubilee-chalets-pms.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: jubilee-pms-db
          property: connectionString

databases:
  - name: jubilee-pms-db
    databaseName: jubilee_pms
    user: jubilee_pms
