{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Your Experience — Jubilee Chalets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --gold: #C9A84C; }
        body { font-family: Inter, sans-serif; background: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { border-radius: 16px; max-width: 420px; width: 100%; }
        .star-rating { display: flex; justify-content: center; gap: 0.5rem; }
        .star-rating input[type="radio"] { display: none; }
        .star-rating label { font-size: 2.5rem; cursor: pointer; color: #d1d5db; transition: color 0.1s; }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label { color: var(--gold); }
        .star-rating { flex-direction: row-reverse; }
        .btn-gold { background: var(--gold); color: white; font-weight: 600; border: none; }
        .btn-gold:hover { background: #b8913a; color: white; }
    </style>
</head>
<body>
<div class="card border-0 shadow p-4 m-3">
    <div class="text-center mb-4">
        <div style="font-family: 'Georgia', serif; color: var(--gold); font-size: 1.25rem; font-weight: 700;">
            Jubilee Chalets
        </div>
        <h5 class="fw-bold mt-2 mb-1">How was your experience?</h5>
        <p class="text-muted small">{{ req.title }}</p>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="mb-4">
            <div class="star-rating">
                <input type="radio" name="rating" id="star5" value="5" required>
                <label for="star5">★</label>
                <input type="radio" name="rating" id="star4" value="4">
                <label for="star4">★</label>
                <input type="radio" name="rating" id="star3" value="3">
                <label for="star3">★</label>
                <input type="radio" name="rating" id="star2" value="2">
                <label for="star2">★</label>
                <input type="radio" name="rating" id="star1" value="1">
                <label for="star1">★</label>
            </div>
        </div>

        <div class="mb-4">
            <textarea name="comment" class="form-control" rows="3"
                      placeholder="Tell us more about your experience (optional)"></textarea>
        </div>

        <button type="submit" class="btn btn-gold w-100 py-2">
            Submit Feedback
        </button>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'guests:portal_home' %}" class="text-muted small">Skip for now</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
