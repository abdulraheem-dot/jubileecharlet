{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint — Jubilee Chalets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --gold: #C9A84C; --dark: #1a2332; }
        body { font-family: Inter, sans-serif; background: #f8f9fa; }
        .guest-header { background: var(--dark); color: white; padding: 1rem 1.25rem; }
        .hotel-name { color: var(--gold); font-weight: 700; }
        .btn-danger-submit { background: #dc2626; color: white; font-weight: 600; border: none; }
        .btn-danger-submit:hover { background: #b91c1c; color: white; }
        .form-control:focus, .form-select:focus { border-color: var(--gold); box-shadow: 0 0 0 0.2rem rgba(201,168,76,0.2); }
    </style>
</head>
<body>

<div class="guest-header d-flex justify-content-between align-items-center">
    <div class="hotel-name"><i class="bi bi-building me-1"></i>Jubilee Chalets</div>
    <span class="text-white-50 small">Room {{ room.number }}</span>
</div>

<div class="container py-4" style="max-width: 520px;">

    <div class="d-flex align-items-center gap-2 mb-4">
        <a href="{% url 'guests:portal_home' %}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h5 class="mb-0 fw-bold">Submit a Complaint</h5>
    </div>

    <div class="alert alert-info small mb-4">
        <i class="bi bi-info-circle me-1"></i>
        Your complaint will be forwarded directly to management and taken seriously.
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 16px;">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-medium">What is your complaint about?</label>
                    <select name="category" class="form-select form-select-lg">
                        {% for v, l in categories %}
                        <option value="{{ v }}">{{ l }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium">Please describe what happened</label>
                    <textarea name="description" class="form-control" rows="5"
                              placeholder="Give as much detail as possible..." required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-medium">How urgent is this?</label>
                    <select name="priority" class="form-select">
                        <option value="LOW">Low — Not time sensitive</option>
                        <option value="NORMAL" selected>Normal</option>
                        <option value="HIGH">High — Needs attention today</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-danger-submit w-100 py-2 fs-5">
                    <i class="bi bi-megaphone me-2"></i> Submit Complaint
                </button>
            </form>
        </div>
    </div>

    <div class="text-center mt-3">
        <a href="{% url 'guests:portal_home' %}" class="text-muted small">← Back to Services</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
