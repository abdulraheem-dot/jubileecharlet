<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Menu — Room {{ room.number }}</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'><style>:root{--gold:#C9A84C;}body{font-family:Inter,sans-serif;background:#f8f9fa;}.guest-header{background:#1a2332;color:white;padding:1rem 1.25rem;}.hotel-name{color:var(--gold);font-weight:700;}.btn-gold{background:var(--gold);color:white;border:none;}</style></head><body><div class='guest-header d-flex justify-content-between'><div class='hotel-name'>Jubilee Chalets</div><span class='text-white-50 small'>Room {{ room.number }}</span></div><div class='container py-4' style='max-width:600px;'><div class='d-flex align-items-center gap-2 mb-4'><a href='{% url guests:portal_home %}' class='btn btn-sm btn-outline-secondary'><i class='bi bi-arrow-left'></i></a><h5 class='mb-0 fw-bold'>Order Food</h5></div><form method='post' action='{% url estaurant:guest_place_order %}'>{% csrf_token %}{% for cat in categories %}<h6 class='text-muted text-uppercase small fw-bold mt-4 mb-2' style='letter-spacing:1px;'>{{ cat.name }}</h6>{% for item in cat.items.all %}{% if item.is_available %}<div class='card mb-2 border-0 shadow-sm'><div class='card-body py-2 px-3 d-flex align-items-center gap-3'><div class='flex-grow-1'><div class='fw-medium'>{{ item.name }}</div><div class='text-muted small'>₦{{ item.price|floatformat:0 }}</div></div><input type='number' name='item_{{ item.pk }}' value='0' min='0' max='10' class='form-control form-control-sm text-center' style='width:70px;'></div></div>{% endif %}{% endfor %}{% endfor %}<div class='mt-4'><label class='form-label fw-medium'>Special Instructions</label><textarea name='special_instructions' class='form-control' rows='2' placeholder='Allergies, preferences...'></textarea></div><button type='submit' class='btn btn-gold w-100 mt-3 py-2 fs-5'><i class='bi bi-bag-check me-2'></i>Place Order</button></form></div><link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css' rel='stylesheet'><script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'></script></body></html>
