<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Order Status</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'></head><body class='bg-light'><div style='background:#1a2332;color:white;padding:1rem 1.25rem;' class='d-flex justify-content-between'><span style='color:#C9A84C;font-weight:700;'>Jubilee Chalets</span><span class='text-white-50 small'>Room {{ order.room.number }}</span></div><div class='container py-4' style='max-width:500px;'><h5 class='fw-bold mb-4'>Order #{{ order.pk }} Status</h5><div class='card border-0 shadow-sm' style='border-radius:16px;'><div class='card-body p-4'><div class='text-center mb-4'><span class='badge fs-6 {% if order.status == DELIVERED %}bg-success{% elif order.status == CANCELLED %}bg-secondary{% elif order.status == READY %}bg-warning text-dark{% else %}bg-primary{% endif %} py-2 px-4'>{{ order.get_status_display }}</span></div>{% for item in order.items.all %}<div class='d-flex justify-content-between small py-1 border-bottom'><span>{{ item.quantity }}x {{ item.item.name }}</span><span>₦{{ item.subtotal|floatformat:0 }}</span></div>{% endfor %}<div class='d-flex justify-content-between fw-bold mt-2'><span>Total</span><span>₦{{ order.total|floatformat:0 }}</span></div></div></div><div class='text-center mt-3'><a href='{% url guests:portal_home %}' class='btn btn-outline-secondary'>← Back to Services</a></div></div></body></html>
